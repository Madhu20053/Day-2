<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="A welcoming space for everyone">
        <title>My Space - Welcome</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background: linear-gradient(135deg, #87CEEB 0%, #E0F6FF 100%);
                color: #333;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                text-align: center;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 20px;
            }

            main {
                background: rgba(255, 255, 255, 0.95);
                border-radius: 15px;
                padding: 40px;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
                max-width: 600px;
                animation: slideIn 0.6s ease-out;
            }

            h1 {
                color: #8B4513;
                font-size: 2.5em;
                margin-bottom: 20px;
                text-decoration: underline wavy #87CEEB;
                text-decoration-thickness: 3px;
                text-underline-offset: 8px;
                letter-spacing: 2px;
            }

            p {
                color: #555;
                font-size: 1.3em;
                line-height: 1.6;
                margin: 15px 0;
                font-weight: 500;
            }

            @keyframes slideIn {
                from {
                    opacity: 0;
                    transform: translateY(-20px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            @media (max-width: 600px) {
                main {
                    padding: 25px;
                }

                h1 {
                    font-size: 1.8em;
                }

                p {
                    font-size: 1.1em;
                }
            }
        </style>
    </head>
    <body>
        <header style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;max-width:700px;margin-left:auto;margin-right:auto">
            <div style="display:flex;align-items:center;gap:10px">
                <div style="width:44px;height:44px;border-radius:10px;background:linear-gradient(45deg,#06b6d4,#7dd3fc);display:grid;place-items:center;color:#fff;font-weight:800">MS</div>
                <div style="text-align:left">
                    <div style="font-weight:800">My Space</div>
                    <div style="font-size:12px;color:#6b7280">Welcome</div>
                </div>
            </div>

            <nav aria-label="Primary navigation">
                <a href="index.html" style="text-decoration:none;color:#06383d;font-weight:700;margin-right:14px">Home</a>
                <a href="product.html" style="text-decoration:none;color:#06383d;font-weight:700;margin-right:14px">Products</a>
                <a href="contact.html" style="text-decoration:none;color:#06383d;font-weight:700">Contact</a>
            </nav>
        </header>

        <main>
            <h1>Hello Guys!</h1>
            <p>Welcome to This space! 🎉</p>
            <p>This is a place for creativity, connection, and endless possibilities.</p>

            <!-- CTA -> products -->
            <div style="margin-top:22px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap">
                <a href="product.html" class="btn" style="background:linear-gradient(90deg,#06b6d4,#7dd3fc);padding:10px 18px;border-radius:12px;color:#052e2f;font-weight:800;text-decoration:none;box-shadow:0 8px 20px rgba(6,38,45,0.08)">
                    Browse Products
                </a>
                <a href="product.html" aria-label="Browse products" class="btn ghost" style="padding:10px 18px;border-radius:12px;color:#555;text-decoration:none;border:1px solid rgba(6,78,59,0.08);background:transparent;">View gallery</a>
            </div>
        </main>
    </body>
</html>
